name: experimental-build

# Manual-only build for the experimental branch. Signed with the release key so
# it can update an installed build in place, but it never creates a release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shark-release.p12"
          {
            echo "SHARK_KEYSTORE=$RUNNER_TEMP/shark-release.p12"
            echo "SHARK_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SHARK_KEY_ALIAS=$KEY_ALIAS"
            echo "SHARK_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build the signed experimental APK
        working-directory: app
        run: |
          set -euo pipefail
          chmod +x gradlew
          export SHARK_VERSION_NAME="2.5.1-exp"
          export SHARK_VERSION_CODE="9001"
          URLS=(
            "https://mirrors.cloud.tencent.com/gradle/gradle-9.7.0-bin.zip"
            "https://mirrors.huaweicloud.com/gradle/gradle-9.7.0-bin.zip"
            "https://services.gradle.org/distributions/gradle-9.7.0-bin.zip"
          )
          for url in "${URLS[@]}"; do
            sed -i -E "s|^distributionUrl=.*|distributionUrl=${url}|" gradle/wrapper/gradle-wrapper.properties
            if ./gradlew :app:assembleRelease --no-daemon --stacktrace; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Upload the experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: shark-experimental-apk
          path: app/app/build/outputs/apk/release/*.apk
          retention-days: 7
